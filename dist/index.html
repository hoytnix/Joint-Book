      "markdown": "## Chapter 13: Restocking and Sustaining\n\nField harm reduction programs rarely shut down because of philosophical disagreements; they shut down when the budget runs out of money for proprietary consumables or the supply chain breaks.\n\nMost commercial drug-checking technologies are engineered around a razor-and-blades revenue model: an agency purchases or receives grant funding for a piece of hardware, only to discover that every individual test requires a proprietary single-use cartridge, a licensed single-assay cassette, or a costly chemical reagent ampoule. When the grant cycle ends, the hardware ends up gathering dust on an office shelf because the program cannot afford the consumables.\n\nThe Purple Canary Protocol was designed from the ground up to be physically sustainable on a shoestring municipal or non-profit budget. Every single item required to maintain operations can be sourced from open, non-regulated, commodity-level supply chains.\n\n---\n\n### Consumables Sourcing: Bypassing Specialty Markups\n\nMaintaining a functioning deployment comes down to three primary consumables: chromatography strips, the developer formulation, and micro-applicator tubes.\n\n```\n  ┌────────────────────────────────────────────────────────────────────────┐\n  │                   COMMODITY-TIER SOURCING BLUEPRINT                    │\n  ├──────────────────────┬────────────────────────┬────────────────────────┤\n  │ ITEM                 │ OPEN-MARKET SOURCE     │ ESTIMATED RUNNING COST │\n  ├──────────────────────┼────────────────────────┼────────────────────────┤\n  │ Whatman #1 Cellulose │ Open science supplier  │ $0.03 – $0.05 / strip  │\n  │ Food-Grade Limonene  │ Citrus processing/bulk │ $18 – $25 / liter      │\n  │ Pure Curcumin Powder │ Bulk spice/botanical   │ $12 – $16 / 100 grams  │\n  │ Borosilicate Tubes   │ Glass capillary stock  │ $0.02 – $0.04 / tube   │\n  └──────────────────────┴────────────────────────┴────────────────────────┘\n```\n\n#### 1. Chromatography Strips\n* **Laboratory Standard:** Untreated Whatman Grade 1 chromatography paper ($20\\text{ mm} \\times 80\\text{ mm}$). Consisting of pure, binder-free $\\beta$-(1,4)-D-glucan polysaccharide chains, it presents uniform capillary pore distribution and retains $5\\%$ to $8\\%$ bound atmospheric water within its amorphous domains. Purchasing pre-cut packs from general scientific distributors costs pennies per strip.\n* **Field Alternative (The Joe Method):** In absolute supply emergencies, unbleached, high-density cellulose coffee filters cut into uniform $20\\text{ mm}$ strips using a paper guillotine or rotary cutter yield readable, functional separation for frontline screening.\n\n#### 2. The 95.5 : 0.5 Developer Formulation\n* **D-Limonene:** Source cold-pressed, food-grade or high-purity botanical degreaser grade (CAS 5989-27-5). Chemically, it is a cyclic $p$-menthadiene hydrocarbon possessing a low dielectric constant ($\\varepsilon \\approx 2.3$) and zero hydrogen-bonding capability. A single 1-liter bottle ($20 to $25) provides enough solvent to run over 500 complete chamber charges.\n* **Curcumin:** Source standardized natural turmeric extract powder standardized to $\\ge 95\\%$ curcuminoids. Curcumin is a polyphenolic diferuloylmethane containing an active keto-enol tautomeric system. A single 100-gram container ($15) provides enough fluorophore dye to formulate tens of liters of developer solution.\n* **Compounding in the Agency Kitchen:** Weigh $0.5\\text{ grams}$ of curcumin powder and dissolve into $95.5\\text{ grams}$ (approximately $113\\text{ mL}$) of pure D-Limonene ($0.5\\%\\text{ w/v}$). Shake vigorously and allow to rest for two hours. If faint sediment remains, filter through a single coffee filter into an amber glass dispensing bottle. Store protected from ultraviolet light to prevent photodegradation.\n\n#### 3. Micro-Capillary Tubes\n* Source non-heparinized borosilicate glass micro-hematocrit capillary tubes or Drummond wiretrol pipettes ($0.5\\ \\mu\\text{L} - 1.0\\ \\mu\\text{L}$). Sourced in bulk cases of 500, they cost roughly $0.02 each.\n\n---\n\n### What Runs Out First: Frontline Depletion Velocity\n\nIf you manage inventory for an outreach station, don't assume all supplies deplete at equal rates. On active shifts, consumables vanish in a very specific hierarchy:\n\n```\n  HIGHEST BURN RATE ──────────────────────────────────────────► LOWEST BURN RATE\n  1. Capillary Tubes  ► 2. Test Strips  ► 3. Torch Batteries  ► 4. Developer  ► 5. Chamber Gaskets\n  (Breakage / loss)     (1.2x per run)    (Voltage sag at 100)  (20 runs/chg)   (Monthly inspect)\n```\n\n1. **Micro-Capillary Tubes (Burns Out First):** Glass capillary tubes are tiny, delicate, and single-use. They roll off tables, get crushed in pockets, or get dropped on concrete. While a test uses one tube, trainees and participants drop or misplace them constantly. **Rule of Thumb:** Stock 2.5 capillary tubes for every 1 test strip in your active inventory.\n2. **Chromatography Strips:** Your primary volume consumable. Account for a 15–20% buffer over participant count to cover practice runs, confirmatory re-tests for anomalous results, and accidental thumb smudges.\n3. **365 nm Torch Coin Batteries:** LED torches do not suddenly go dark when batteries die; their ultraviolet output dims gradually. After roughly 80 to 100 scans, the 365 nm wavelength power drops below optimal excitation thresholds, making weak bands harder to distinguish. Always keep two spare sleeves of CR2016 or CR2032 coin cells in the field kit.\n4. **Developer Solution:** A 30 mL dropper bottle charges a thermos roughly 15 to 20 times. Because one charge can develop multiple strips in a single session, developer solution lasts longer than paper or tubes, provided droppers are kept tightly capped to prevent evaporation.\n5. **Silicone Chamber Gaskets (Slowest Wear):** The rubber seal inside the thermos lid gradually compresses or degrades over 6 to 12 months. Keep a pack of standard food-grade silicone replacement gaskets in the agency supply cabinet.\n\n---\n\n### In-House Printing: Trifolds and SOPs for Pennies\n\nParticipant education should not rely on expensive glossy print shops.\n\nThe one-page field SOP summary and participant education guides are designed to be printed directly on your agency's standard black-and-white office copier as double-sided, letter-sized trifold brochures:\n\n* **The Trifold Handout:** Contains the three-step **SPOT → SNAP → KNOW** breakdown, the visual color guide for typical cannabinoid corridors, and local community resources (overdose lines, local syringe exchanges, and naloxone access points).\n* **Printing Cost:** Less than three cents per trifold using standard 20 lb copy paper.\n* **Laminated Stations:** Print three copies of Chapter 9’s full SOP, laminate them at a local library or office supply store, and tape them directly to your folding station tables for immediate reference by outreach volunteers.\n\n---\n\n### Hardware Maintenance: Keeping the Deployment Alive\n\nBecause the kit relies on rugged, passive physical tools rather than fragile microchips, hardware maintenance is straightforward:\n\n#### The Stainless Steel Thermal Bottle\n* **Daily Cleaning:** At the end of an outreach shift, dump any spent developer solution from the bottle reservoir into the coffee-ground waste bin. Rinse the interior with $5\\text{ mL}$ of isopropyl alcohol and wipe clean with a paper towel. Leave the cap off overnight to dry.\n* **Gasket Inspection:** Inspect the rubber sealing gasket inside the threaded lid once a month. If the gasket is pinched, cracked, or missing, the chamber cannot maintain vapor saturation, causing migration stalls. Replace gaskets using standard silicone replacement rings available at any hardware store.\n\n#### The 365 nm UV Torch\n* **Battery Cycles:** Swap coin batteries every 80–100 scans or whenever the baseline curcumin fluorescence appears pale rather than bright greenish-yellow.\n* **Lens Care:** Wipe the UV emitter lens with an alcohol prep pad once a week to clear away pocket lint and fingerprint grease.\n\n#### Reagent Longevity & Sun Exposure\n* **Amber Glass Requirement:** Curcumin is naturally light-sensitive and photodegrades under continuous ambient light. Always store bulk and dropper-dispenser developer bottles in amber glass or opaque containers. If a batch turns from deep golden-orange to pale translucent yellow, discard the bottle and mix a fresh 95.5:0.5 batch.\n\n---\n\n### Operating on a Micro-Budget\n\nA complete operating budget for a community program running 1,000 tests per year looks like this:\n\n| Component | Annual Quantity | Sourcing Strategy | Annual Cost |\n| --- | --- | --- | --- |\n| **Cellulose Test Strips** | 10 Packs (100/ea) | Science supply bulk packs | $40.00 |\n| **D-Limonene Solvent** | 2 Liters | Food-grade bulk supplier | $45.00 |\n| **Curcumin Powder** | 100 Grams | Botanical bulk spice | $15.00 |\n| **Capillary Tubes** | 2 Packs (500/ea) | Bulk laboratory glass | $30.00 |\n| **CR2016 UV Batteries** | 2 Sleeves (10/ea) | Standard hardware multipack | $14.00 |\n| **Trifold Photocopies** | 1,000 Copies | Internal agency copier | $25.00 |\n| **TOTAL ANNUAL CONSUMABLES** | **1,000 Complete Tests** | | **$169.00** |\n\nAt **$169.00 per thousand tests**, the running cost sits at approximately **16.9 cents per test** including all printed collateral and fresh hardware components—or drops below **0.17 cents per test** for the raw chemistry alone.\n\nBy stripping out proprietary vendor lock-in, your agency is never held hostage by supply shortages, expired proprietary cassettes, or corporate price hikes. The tools stay cheap, the supply lines remain open, and the testing table stays open every single night your community needs it.",

      "markdown": "## Chapter 14: The Economics of Free Testing\n\nProviding free, point-of-care drug checking is an ethical imperative, but sustaining it is an economic problem. Harm-reduction agencies operate inside volatile funding environments where political winds shift, opioid-settlement dollars get delayed in bureaucratic committees, and small municipal grants expire without warning.\n\nIf a public health program depends on high-cost proprietary machines and $50-per-sample commercial testing fees, it lives on borrowed time. The moment funding contracts constrict, services get rationed, hours get cut, and frontline workers are forced to turn away the very people who need screening most.\n\nTo make free testing permanent, an agency must treat economic resilience as a core operational feature. That means understanding three interconnected systems: diversified funding streams, persuasive grant architecture, and software cost structuring.\n\n---\n\n### Funding Models: Beyond Single-Source Grants\n\nRelying entirely on a single federal or state grant to fund drug checking creates single-point-of-failure vulnerability. Sustainable programs build a blended revenue model combining multiple distinct funding pools:\n\n1. **Opioid Settlement Funds:** Billions of dollars from national opioid litigation settlements continue to flow directly to county boards, city councils, and regional public-health authorities. Because the Purple Canary Protocol directly targets adulterant screening, overdose prevention, and local supply monitoring, it matches the primary remediation criteria mandated by settlement trust agreements.\n2. **Municipal Public Health Line Items:** City health departments often hold flexible discretionary allocations for seasonal outreach, needle-exchange supplies, or emergency overdose spikes. A deployment requiring only $25 per mobile kit and fractions of a penny per test can easily be approved under petty-cash limits or existing harm-reduction supply budgets without requiring months of city council debate.\n3. **Private Foundations & Community Trusts:** Regional philanthropic funds often avoid buying $40,000 capital laboratory assets due to ongoing maintenance risks, but they eagerly fund direct, tangible field supplies. Asking a local foundation for $2,500 to fund an entire year of community screening kits for ten satellite clinics is an easy, high-impact proposal for a program officer to greenlight.\n4. **Grassroots Mutual Aid & Micro-Donations:** Because the materials list consists of everyday, non-scheduled items (stainless bottles, citrus terpene, turmeric, coffee filters, and battery lights), mutual-aid groups and local supporter networks can stock an outreach clinic directly through community wishlists without navigating medical supply-chain hurdles.\n\n---\n\n### The Grant Language: How to Describe the Program to a Funder\n\nGrant reviewers evaluate proposals based on measurable impact, risk reduction, operational feasibility, and return on investment. When seeking public or private funding for the Purple Canary Protocol, avoid colloquial street phrasing. Frame the project using established public-health nomenclature:\n\n> **Program Title:** *Decentralized Point-of-Care Botanical and Synthetic Drug Surveillance Initiative*  \n>   \n> **Project Abstract for Grant Officers:**  \n> *\"This initiative deploys an open-source, non-destructive, micro-scale chromatographic screening methodology (Thin-Layer Chromatography paired with optical densitometry) across frontline outreach sites. By utilizing a standardized food-grade terpene mobile phase ($95.5\\%$ D-Limonene) and a non-carcinogenic polyphenolic fluorophore ($0.5\\%$ Curcumin w/v), frontline peer specialists evaluate community samples for synthetic cannabinoid receptor agonists (SCRAs), novel psychoactive substances (NPS), and hazardous bulking agents in under five minutes.  \n>   \n> Operating at an initial hardware cost of approximately $25 per station and a marginal consumable cost of under $0.01 per test, this platform eliminates reliance on costly centralized laboratory backlogs while delivering immediate, point-of-care harm-reduction counseling directly to underserved populations. All optical telemetry is anonymized and aggregated into an early-warning signal that monitors local supply contamination trends in real time without collecting participant personally identifiable information.\"*\n\nThis framing directly addresses every major concern a public-health grant committee evaluates: safety compliance, fiscal efficiency, rapid response times, and non-carceral participant data protections.\n\n---\n\n### The Cost-Per-Test Math: Lab Outsourcing vs. The Protocol\n\nWhen a grant committee reviews your budget, the decisive factor is often the comparative cost table. Showing the fiscal disparity between commercial laboratory outsourcing and decentralized field screening provides immediate justification for funding your deployment:\n\n| Metric | Centralized Lab Outsourcing (GC-MS / FTIR) | The Purple Canary Protocol (Decentralized TLC) |\n| --- | --- | --- |\n| **Capital Equipment Cost** | $30,000 – $75,000 per unit | **~$25.00** per station deployment |\n| **Cost per 1,000 Tests** | $35,000 – $50,000 (at $35–$50/sample lab fees) | **~$1.67** (raw chemistry) / **~$169.00** (all supplies) |\n| **Result Turnaround Time** | 3 to 14 business days | **3 to 5 minutes** at point of care |\n| **Waste Disposal Overhead** | Hazardous chemical waste disposal permits | **Zero biohazard cost** (food-grade citrus wash) |\n| **Cost per Participant Engagement** | Prohibitive for routine daily testing | **Fractions of a cent** per screening intervention |\n\n**The Paragraph a Grant Officer Needs to Read:**\n\n\"At traditional commercial laboratory pricing of $35 to $50 per sample, a community outreach program screening 2,000 participant samples per year requires an annual operating allocation of $70,000 to $100,000 solely for chemical evaluation. By contrast, transitioning to the decentralized Purple Canary Protocol enables our agency to conduct the identical 2,000 screenings for less than $350 in total annual consumable materials. This achieves a $>99\\%$ reduction in screening expenditure, freeing grant capital to directly fund frontline peer staffing, sterile supplies, and naloxone distribution while expanding testing volume by an order of magnitude.\"\n\n---\n\n### Software Tiers: Supporting Community Access\n\nMaintaining a living digital reference library—training computer-vision models, hosting normalized $R_f$ baselines, and maintaining cryptographic verification infrastructure—requires server resources and software development maintenance.\n\nTo keep the ecosystem sustainable without putting a price tag on community safety, the digital scanning infrastructure relies on a tiered operational model:\n\n```\n  ┌─────────────────────────────────────────────────────────────┐\n  │                 THE SOFTWARE ECOSYSTEM TIERS                │\n  ├─────────────────────────────────────────────────────────────┤\n  │ 1. INDIVIDUAL TIER: Free / Pay-What-You-Want                │\n  │    • Complete access to SPOT → SNAP → KNOW scanning        │\n  │    • Ad-supported or free community downloads               │\n  │    • Zero paywalls for individual lifesaving tools          │\n  ├─────────────────────────────────────────────────────────────┤\n  │ 2. COMMUNITY / MUTUAL-AID: Subsidized Sponsored Accounts    │\n  │    • Verified non-profit status or peer collective        │\n  │    • Full batch scanning without banner ads                 │\n  │    • Free access funded through enterprise revenue          │\n  ├─────────────────────────────────────────────────────────────┤\n  │ 3. ENTERPRISE / AGENCY TIER: Institutional Subscriptions    │\n  │    • Multi-location fleet management & staff accounts       │\n  │    • Multi-station telemetry dashboards & trend alerts   │\n  │    • Encrypted CSV / PDF export for grant reporting      │\n  │    • Billed to municipal grants and health departments      │\n  └─────────────────────────────────────────────────────────────┘\n```\n\n1. **The Individual Tier:** A person testing their own supply on a kitchen table should never encounter a payment barrier. The consumer-facing mobile scanner is free to download and run, supported by unobtrusive partner sponsorships or pay-what-you-can contributions.\n2. **The Community Tier:** Small, un-funded volunteer collectives, squat clinics, and volunteer syringe exchanges access ad-free agency features through sponsored community waivers.\n3. **The Institutional Agency Tier:** Funded public health agencies, municipal health departments, and hospital systems purchase organizational subscriptions. This tier provides multi-seat administrative control, regional telemetry feeds, bad-batch alert broadcasting, and automated reporting modules designed for grant compliance.\n\nThis economic architecture ensures that institutional programs with formal funding budgets support the server maintenance and research costs of the open platform. The individual consumer on the street and the shoestring volunteer group never pay a dime.\n\nFree testing is not a temporary luxury funded by a fleeting charity drive. Built on commodity chemistry, open-market sourcing, and aligned software incentives, it becomes a permanent community utility that keeps running year after year.",

      "markdown": "## Chapter 15: Open Methods, Open Knowledge\n\nThe moment an institution discovers an effective testing method, the historical instinct is almost always the same: fence it in, brand it, classify it, and charge admission.\n\nWe have seen this script play out across public health for decades. A breakthrough occurs that can distinguish clean medicine from lethal adulteration, but instead of entering every home and outreach bag, it gets locked inside high-margin instrument monopolies, walled research journals, and patented cartridge ecosystems. The gatekeepers convince themselves that secrecy is necessary—that the general public cannot be trusted with the raw mechanisms of chemistry, or that proprietary moats are the only way to build value.\n\nThe consequence of that gatekeeping is not quality control; it is preventable death.\n\nWhen knowledge is withheld, adulterated supply thrives in the dark. The only way to dismantle an opaque, predatory street market is with an equally aggressive, open-source defense: open chemistry, open telemetry, and completely decentralized verification.\n\n---\n\n### A Subversive Liturgy of Demystification\n\nIn traditional science, analytical chemistry functions like an exclusive priesthood. Specialized technicians in isolated cleanrooms interpret complex signals and issue top-down decrees: *this sample is pure; that sample is contraband*. The end consumer is treated as a passive recipient, shut out from the empirical process and left to trust an institutional authority that has repeatedly let them down.\n\nThe Purple Canary Protocol is built on a very different premise: it is a **subversive liturgy of demystification**.\n\nIt is \"liturgical\" because it follows an exacting, reproducible physical rhythm: marking the pencil origin, measuring the micro-drop, saturating the chamber, and letting the fluid climb. It demands rigor and discipline. But it is \"subversive\" because it performs this ritual out in the open—on a park bench, on a van tailgate, or across a drop-in clinic counter—using materials pulled from a grocery aisle and a hardware shelf.\n\nWatching the solvent front travel physically up a cellulose strip and witnessing the fluorescence separate under 365 nm light directly restores **epistemic agency**. You do not have to take someone's word for what is in front of you; you do not have to trust a corporate stamp or a dealer's promise. You observe the physical laws of molecular migration with your own eyes.\n\n---\n\n### The Three Foundational Contrasts\n\nThe entire philosophy of the protocol resolves three historical tensions that have kept ordinary communities separated from analytical science:\n\n```\n  TRADITIONAL FORENSIC MODEL                 THE PURPLE CANARY PARADIGM\n  ───────────────────────────────────────    ───────────────────────────────────────\n  1. Toxic, regulated reagents & solvents ──► Kitchen-safe D-Limonene & Curcumin\n  2. Expensive, fragile optical sensors   ──► Analog paper meets mobile phone vision\n  3. Closed carceral & medical gatekeeping ──► Decentralized peer-to-peer mutual aid\n```\n\n#### 1. Kitchen-Safe Chemistry vs. Toxic Reagents\nTraditional laboratory chromatography relies on carcinogenic diazonium salts (like Fast Blue BB), chloroform, and volatile petroleum ethers. Those compounds belong in industrial fume hoods, not community spaces. By replacing hazardous reagents with an un-scheduled terpene matrix derived from orange rinds and turmeric, testing is stripped of its biohazard baggage. A volunteer can spill a drop on their fingers, wipe it off with a towel, and keep working without hazard protocols.\n\n#### 2. Analog Paper Meets the Digital Eye\nArchaic cellulose filter paper is one of the cheapest physical media on Earth. It operates without power, without code, and without silicon chips. Yet, by pairing that passive physical climb with the high-resolution optical sensor and machine-learning densitometry living on every modern smartphone, the protocol achieves forensic-grade reading accuracy without proprietary field hardware.\n\n#### 3. Street-Level Mutual Aid vs. Institutional Bureaucracy\nInstitutional bureaucracy treats testing as a surveillance tool to log infractions or police behavior. Frontline harm reduction treats testing as an act of mutual survival. Adopting the exact, formal language of an institutional Standard Operating Procedure (SOP) is not done to bow to administrative authority; it is done to establish **forensic parity**. It gives everyday people and peer outreach workers the exact same structural validity and analytical credibility that state crime labs claim for themselves.\n\n---\n\n### Secrecy as Betrayal: Why Methods Must Be Shared\n\nIf the goal of harm reduction is to keep people alive, treating testing formulas as proprietary trade secrets is a direct moral failure.\n\nConsider what happens when a test formulation is hidden behind patent walls:\n\n* Competitors cannot audit or validate the underlying library data.\n* Independent researchers cannot verify retention factors or challenge false-negative rates.\n* When supply chains stutter, clinics that run out of proprietary consumables are forced to halt operations entirely.\n\nBy making every single component, ratio, and step open-source—documenting the 95.5:0.5 D-Limonene/Curcumin formulation, the Whatman Grade 1 cellulose parameters, and the densitometric calculation formulas—the protocol becomes immune to corporate capture. Anyone can compound the developer. Anyone can cut the strips. Anyone can verify the results.\n\nOpen knowledge is resilient knowledge. Once a community understands how to test its own supply, that capability can never be rescinded, defunded, or regulated out of existence.\n\n---\n\n### Joe’s Kicker: Disrupting the Old Guard\n\nWhen Joe and I were talking through the open documentation of this project, we kept circling back to the sheer absurdity of the legacy pharmaceutical vaults we grew up around in Allegan. For generations, corporate gatekeepers guarded basic chemical steps behind seven-year non-compete agreements and locked industrial doors—all to protect manual guesswork and rudimentary physics.\n\nJoe laughed, shook his head, and laid out the real market truth:\n\n*\"Mike, if you actually published all of this—if you put the entire catalog out on a 'DOPE.wiki' for the whole world to see—it wouldn't just inform people. It would put the old guard out of business.\"*\n\nHe was right.\n\nOpenness is not just a moral principle; it is an engine of systemic disruption. The multi-million-dollar testing monopolies rely entirely on consumers and public health directors remaining intimidated by chemical jargon. The moment you hand an outreach director or an everyday consumer a twenty-five-dollar kit that executes reliable presumptive separation for pennies, the legacy monopoly collapses under its own weight.\n\n---\n\n### The Credibility Document for Community Leadership\n\nThis book is not merely a user manual for the individual consumer; it is a **foundational credibility document** meant to be handed directly to municipal stakeholders, shelter executive directors, and public health officers.\n\nWhen you walk into a meeting with a civic task force, an agency board, or an outreach supervisor, hand them this text. Show them that decentralized drug checking does not mean reckless experimentation. Point them to the empirical mathematical rigor of the $R_f$ migration windows, the compound-by-compound chromatographic cross-check against international forensic compendia (including UNODC manuals and *Clarke’s Analysis of Drugs and Poisons*), the chemical plausibility justifications rooted in molecular partition mechanics, and the transparent acknowledgment of literature gaps under the honest-uncertainty contract.\n\nWe do not need to wait for institutional permission to protect our communities from tainted supply. The physical laws of chromatography belong to the public domain. The light belongs to everyone.\n\nPut the protocol on the table, teach your team, distribute the strips, and take your community's safety into your own hands.",

      "markdown": "# Closing: The Living Protocol\n\nA field protocol is never a static document locked in a glass display case; it is a living, collective defense system.\n\nThroughout this book, we have traveled from cold parking lots and kitchen counters to outreach vans and municipal health departments. We took what institutions told you was impossible—doing real chemical separation without an eighty-thousand-dollar machine—and grounded it in three everyday principles: paper, light, and lemon.\n\nEvery time a peer specialist opens a thermal chamber on a tailgate, spots a fresh strip with a steady hand, and uploads a verified scan to the network, the shared defense line gets stronger. A faint, uncharacterized quenching band spotted outside a music venue in Michigan might provide the decentralized telemetry that flags a novel synthetic adulterant before it claims a life three states away. When ordinary people share data instead of hoarding secrets, the street market loses its ability to operate in the dark.\n\nThe tools in this book were not handed down from a corporate boardroom or an academic ivory tower. They were forged in home kitchens, tested across unbleached coffee filters with clearance-bin digital calipers, refined with culinary turmeric and cold-pressed citrus rinds, and released freely into the public domain so that no human being ever has to fly blind in an adulterated world.\n\nNow, the protocol belongs to you.\n\nIf you are an individual holding an unverified product at a kitchen table, test it before you take it. If you are an outreach director running a clinic on a shoestring budget, teach your team, print the trifolds, set up the thermos stations, and bring forensic parity to the people you serve. Do not wait for institutional permission to protect the people you love.\n\nThe next time someone hands you an unverified bag and the old dread creeps into the room, you will never have to wonder in the dark again.\n\nPick up a strip, prepare your chamber, click on the light, and know what's real.",

      "markdown": "# Back Matter\n\n## Glossary of Plain-English Terms\n\n* <span id=\"term-adulterant\"><a href=\"#term-adulterant\" class=\"glossary-anchor\">**Adulterant:**</a></span> A foreign, unlisted chemical agent, synthetic drug, or bulking oil added to a substance to mimic potency, cut production costs, or stretch supply weight.\n* <span id=\"term-capillary-action\"><a href=\"#term-capillary-action\" class=\"glossary-anchor\">**Capillary Action:**</a></span> The physical phenomenon where a liquid automatically creeps upward through narrow spaces or porous cellulose fibers against gravity due to surface tension and adhesive forces.\n* <span id=\"term-cbd\"><a href=\"#term-cbd\" class=\"glossary-anchor\">**Cannabidiol (<abbr title=\"Cannabidiol\">CBD</abbr>):**</a></span> A non-intoxicating phytocannabinoid featuring an open resorcinol ring and a $p$-menthadienyl terpene tail; migrates at $R_f = 0.42 - 0.48$ in the Purple Canary system.\n* <span id=\"term-cbn\"><a href=\"#term-cbn\" class=\"glossary-anchor\">**Cannabinol (<abbr title=\"Cannabinol\">CBN</abbr>):**</a></span> The oxidized, fully aromatized degradation product of THC featuring a planar tricyclic core; strongly retarded by cellulose paper to $R_f = 0.34 - 0.40$.\n* <span id=\"term-chromatography\"><a href=\"#term-chromatography\" class=\"glossary-anchor\">**Chromatography:**</a></span> The physical separation of a chemical mixture by passing it through a stationary phase (like cellulose paper) using a moving carrier solvent (the mobile phase).\n* <span id=\"term-clia\"><a href=\"#term-clia\" class=\"glossary-anchor\">**<abbr title=\"Clinical Laboratory Improvement Amendments\">CLIA</abbr> (Clinical Laboratory Improvement Amendments):**</a></span> Federal regulatory standards governing diagnostic laboratory testing; forensic presumptive testing in field harm-reduction settings is CLIA-exempt.\n* <span id=\"term-colorimetry\"><a href=\"#term-colorimetry\" class=\"glossary-anchor\">**Colorimetry:**</a></span> The quantitative measurement and profiling of wavelength, shade, and color saturation across specific optical color channels (such as red, green, and blue RGB intensity vectors).\n* <span id=\"term-curcumin\"><a href=\"#term-curcumin\" class=\"glossary-anchor\">**Curcumin:**</a></span> The primary polyphenolic active compound in turmeric spice (diferuloylmethane); acts as an integrated indicator dye and natural fluorophore in the developer matrix.\n* <span id=\"term-densitometry\"><a href=\"#term-densitometry\" class=\"glossary-anchor\">**Densitometry:**</a></span> The analytical technique used to scan and measure light absorption, optical density, and band concentration along the vertical migration lane of a test strip.\n* <span id=\"term-dielectric-constant\"><a href=\"#term-dielectric-constant\" class=\"glossary-anchor\">**Dielectric Constant ($\\varepsilon$):**</a></span> A fundamental measure of a solvent's polarity and ability to stabilize electrical charges; non-polar D-limonene exhibits $\\varepsilon \\approx 2.3$, offering negligible eluotropic power for basic amine salts.\n* <span id=\"term-d-limonene\"><a href=\"#term-d-limonene\" class=\"glossary-anchor\">**D-Limonene:**</a></span> A naturally occurring, food-grade terpene solvent (cyclic $p$-menthadiene hydrocarbon) cold-pressed from citrus rinds that functions as the non-polar mobile carrier.\n* <span id=\"term-eluotropic-strength\"><a href=\"#term-eluotropic-strength\" class=\"glossary-anchor\">**Eluotropic Strength:**</a></span> The thermodynamic capability of a solvent to desorb solutes from a polar stationary phase like cellulose and carry them upward.\n* <span id=\"term-evali\"><a href=\"#term-evali\" class=\"glossary-anchor\">**<abbr title=\"E-cigarette or Vaping Use-Associated Lung Injury\">EVALI</abbr>:**</a></span> E-cigarette or Vaping Use-Associated Lung Injury; a severe pulmonary disease cluster identified in 2019 caused by the inhalation of toxic pyrolysis products from Vitamin E Acetate.\n* <span id=\"term-false-negative\"><a href=\"#term-false-negative\" class=\"glossary-anchor\">**False Negative:**</a></span> An analytical error where a test fails to detect a dangerous compound that is actually present; the most dangerous failure mode in harm reduction.\n* <span id=\"term-false-positive\"><a href=\"#term-false-positive\" class=\"glossary-anchor\">**False Positive:**</a></span> An analytical error where a test flags an adulterant or anomalous band when the sample is actually benign.\n* <span id=\"term-fts\"><a href=\"#term-fts\" class=\"glossary-anchor\">**Fentanyl Test Strip (<abbr title=\"Fentanyl Test Strip\">FTS</abbr>):**</a></span> A rapid, water-based lateral flow immunoassay engineered to detect trace nanogram concentrations of fentanyl and major fentanyl analogs.\n* <span id=\"term-fluorophore\"><a href=\"#term-fluorophore\" class=\"glossary-anchor\">**Fluorophore:**</a></span> A chemical compound or molecule that absorbs invisible light (such as long-wave 365 nm UV-A) and re-emits it as visible, glowing luminescence.\n* <span id=\"term-fluorescence-quenching\"><a href=\"#term-fluorescence-quenching\" class=\"glossary-anchor\">**Fluorescence Quenching:**</a></span> The optical phenomenon where a compound absorbs ultraviolet light without glowing, appearing as a dark silhouette or shadow band against a fluorescent background.\n* <span id=\"term-forensic-parity\"><a href=\"#term-forensic-parity\" class=\"glossary-anchor\">**Forensic Parity:**</a></span> The principle that ordinary individuals deserve equal access to the same fundamental physical truths about what enters their bodies as state crime laboratories possess.\n* <span id=\"term-ftir\"><a href=\"#term-ftir\" class=\"glossary-anchor\">**<abbr title=\"Fourier-Transform Infrared Spectroscopy\">FTIR</abbr> (Fourier-Transform Infrared Spectroscopy):**</a></span> A confirmatory optical technology that measures how molecules absorb infrared light to create an absorption spectrum.\n* <span id=\"term-gc-ms\"><a href=\"#term-gc-ms\" class=\"glossary-anchor\">**<abbr title=\"Gas Chromatography-Mass Spectrometry\">GC-MS</abbr> (Gas Chromatography-Mass Spectrometry):**</a></span> The laboratory gold standard for confirmatory drug testing; vaporizes compounds, separates them through a capillary column, shatters them with electron beams, and weighs the fragments.\n* <span id=\"term-good-samaritan-laws\"><a href=\"#term-good-samaritan-laws\" class=\"glossary-anchor\">**Good Samaritan Laws:**</a></span> Statutes that provide legal immunity from drug possession arrests or prosecution for individuals who call 911 during an overdose emergency.\n* <span id=\"term-hplc\"><a href=\"#term-hplc\" class=\"glossary-anchor\">**<abbr title=\"High-Performance Liquid Chromatography\">HPLC</abbr> (High-Performance Liquid Chromatography):**</a></span> A confirmatory laboratory instrument that pumps liquid solvent under high pressure through a column to separate and quantify non-volatile chemical compounds.\n* <span id=\"term-indazole-3-carboxamides\"><a href=\"#term-indazole-3-carboxamides\" class=\"glossary-anchor\">**Indazole-3-Carboxamides:**</a></span> A potent chemical class of synthetic cannabinoid receptor agonists (such as ADB-PINACA) lacking phenolic hydroxyl groups and migrating higher up paper strips ($R_f = 0.68 - 0.74$).\n* <span id=\"term-keto-enol-tautomerism\"><a href=\"#term-keto-enol-tautomerism\" class=\"glossary-anchor\">**Keto-Enol Tautomerism:**</a></span> An active chemical equilibrium where a molecule rapidly interconverts between ketone and enol structural isomers; responsible for the distinct solvent interactions and fluorophore shifts of curcumin.\n* <span id=\"term-lod\"><a href=\"#term-lod\" class=\"glossary-anchor\">**Limit of Detection (<abbr title=\"Limit of Detection\">LOD</abbr>):**</a></span> The lowest physical concentration of a substance that an analytical method can reliably distinguish from background noise.\n* <span id=\"term-matrix-masking\"><a href=\"#term-matrix-masking\" class=\"glossary-anchor\">**Matrix Masking:**</a></span> An interference phenomenon where heavy plant waxes, dark tars, or thick unrefined oils physically trap or obscure trace adulterants on a test strip.\n* <span id=\"term-mct\"><a href=\"#term-mct\" class=\"glossary-anchor\">**Medium-Chain Triglycerides (<abbr title=\"Medium-Chain Triglycerides\">MCT</abbr> Oil):**</a></span> Bulking lipids made of caprylic and capric fatty acid chains ($R_f = 0.80 - 0.88$); an illicit cutting agent in vape cartridges.\n* <span id=\"term-mobile-phase\"><a href=\"#term-mobile-phase\" class=\"glossary-anchor\">**Mobile Phase:**</a></span> The moving liquid solvent mixture (95.5% D-Limonene : 0.5% Curcumin w/v) that dissolves and carries chemical compounds up the chromatography strip.\n* <span id=\"term-psa\"><a href=\"#term-psa\" class=\"glossary-anchor\">**Molecular Polar Surface Area (<abbr title=\"Molecular Polar Surface Area\">PSA</abbr>):**</a></span> The total surface area of all polar atoms (primarily nitrogen and oxygen) in a molecule; governs hydrogen-bonding capture on poly-hydroxyl cellulose.\n* <span id=\"term-naloxone\"><a href=\"#term-naloxone\" class=\"glossary-anchor\">**Naloxone (Narcan):**</a></span> An opioid receptor antagonist medication that rapidly reverses life-threatening opioid-induced respiratory depression.\n* <span id=\"term-normal-phase-chromatography\"><a href=\"#term-normal-phase-chromatography\" class=\"glossary-anchor\">**Normal-Phase Chromatography:**</a></span> A separation system where a polar stationary phase (cellulose paper) is paired with a non-polar or weakly polar mobile phase (terpene solvent).\n* <span id=\"term-presumptive-testing\"><a href=\"#term-presumptive-testing\" class=\"glossary-anchor\">**Presumptive Testing:**</a></span> Rapid point-of-care screening methods that indicate the probable presence or absence of specific compound classes without issuing quantitative molecular confirmation.\n* <span id=\"term-rf\"><a href=\"#term-rf\" class=\"glossary-anchor\">**Retention Factor (<abbr title=\"Retention Factor\">$R_f$</abbr>):**</a></span> The standardized decimal fraction describing how far a specific chemical migrated relative to the total distance traveled by the solvent front ($R_f = d_{\\text{analyte}} / d_{\\text{solvent}}$).\n* <span id=\"term-scra\"><a href=\"#term-scra\" class=\"glossary-anchor\">**<abbr title=\"Synthetic Cannabinoid Receptor Agonist\">SCRA</abbr> (Synthetic Cannabinoid Receptor Agonist):**</a></span> Potent, lab-synthesized research chemicals (such as ADB-PINACA or MDMB-4en-PINACA) engineered to bind aggressively to CB1 receptors.\n* <span id=\"term-solvent-front\"><a href=\"#term-solvent-front\" class=\"glossary-anchor\">**Solvent Front:**</a></span> The highest physical boundary line reached by the migrating liquid developer before the strip is pulled from the chamber ($R_f = 1.00$).\n* <span id=\"term-sop\"><a href=\"#term-sop\" class=\"glossary-anchor\">**<abbr title=\"Standard Operating Procedure\">SOP</abbr> (Standard Operating Procedure):**</a></span> Standardized, sequential step-by-step instructions designed to ensure analytical repeatability and forensic precision.\n* <span id=\"term-stationary-phase\"><a href=\"#term-stationary-phase\" class=\"glossary-anchor\">**Stationary Phase:**</a></span> The porous solid matrix (untreated Whatman Grade 1 cellulose paper, composed of $\\beta$-(1,4)-D-glucan polysaccharide fibers) that provides physical resistance during chromatography ($R_f = 0.00$).\n* <span id=\"term-thc\"><a href=\"#term-thc\" class=\"glossary-anchor\">**$\\Delta^9$-Tetrahydrocannabinol ($\\Delta^9$-<abbr title=\"Tetrahydrocannabinol\">THC</abbr>):**</a></span> The primary psychoactive cannabinoid in natural cannabis; migrates cleanly at $R_f = 0.52 - 0.58$ in the Purple Canary system.\n* <span id=\"term-unodc\"><a href=\"#term-unodc\" class=\"glossary-anchor\">**<abbr title=\"United Nations Office on Drugs and Crime\">UNODC</abbr>:**</a></span> United Nations Office on Drugs and Crime; publisher of authoritative international laboratory analytical manuals for forensic drug identification.\n* <span id=\"term-vitamin-e-acetate\"><a href=\"#term-vitamin-e-acetate\" class=\"glossary-anchor\">**Vitamin E Acetate ($\\alpha$-Tocopheryl Acetate):**</a></span> A thick, oily synthetic ester implicated in EVALI lung injuries; migrates near the solvent front ($R_f = 0.84 - 0.92$) due to high lipophilicity.\n* <span id=\"term-whatman-grade-1\"><a href=\"#term-whatman-grade-1\" class=\"glossary-anchor\">**Whatman Grade 1 Cellulose:**</a></span> Pure, binder-free cotton cellulose filter paper with controlled pore size used as the standardized stationary phase.\n* <span id=\"term-xylazine\"><a href=\"#term-xylazine\" class=\"glossary-anchor\">**Xylazine (\"Tranq\"):**</a></span> A non-opioid veterinary sedative that does not respond to naloxone, increasingly co-mingled with street drug supplies.\n\n---\n\n## Authoritative Analytical Literature & Benchmark Sources\n\nThe empirical migration windows, retention mechanics, and chemical plausibility assessments across this protocol are cross-referenced against the following peer-reviewed forensic compendia, monographs, and analytical studies:\n\n* **United Nations Office on Drugs and Crime (UNODC).** (2022). *Recommended Methods for the Identification and Analysis of Cannabis and Cannabis Products* (Manual for Use by National Drug Analysis Laboratories, ST/NAR/40/Rev.1). United Nations Publications, Vienna.\n* **Moffat, A. C., Osselton, M. D., & Widdop, B. (Eds.).** (2011). *Clarke’s Analysis of Drugs and Poisons in Pharmaceuticals, Body Fluids and Postmortem Material* (4th ed.). Pharmaceutical Press, London. ISBN: 978-0-85369-711-4.\n* **Sherma, J., & Rabel, S. R.** (2019). Thin layer chromatography in the analysis of cannabis and its components and synthetic cannabinoids. *Journal of Liquid Chromatography & Related Technologies*, 42(15–16), 475–492. DOI: 10.1080/10826076.2019.1663529.\n* **Banister, S. D., Moir, M., Stuart, J., Kevin, R. C., Wood, K. E., Longworth, M., Wilkinson, S. M., Beinat, C., Buchanan, A. S., Glass, M., Connor, M., McGregor, I. S., & Kassiou, M.** (2015). Pharmacology of valine and tert-leucine-derived indazole and indole synthetic cannabinoid receptor agonists: 5F-AMB, 5F-MDMB-PINACA, ADB-PINACA, and their analogues. *ACS Chemical Neuroscience*, 6(9), 1546–1559. DOI: 10.1021/acschemneuro.5b00112.\n* **Antonides, M. S. et al.** (2020). Rapid identification and analytical characterization of MDMB-4en-PINACA in forensic drug seizures. *Drug Testing and Analysis*, 12(9), 1346–1358. DOI: 10.1002/dta.2882.\n* **Korte, F., & Sieper, H.** (1960). Zur chemischen Klassifizierung von Pflanzen. XVIII. Untersuchung von Haschisch-Inhaltsstoffen durch Dünnschichtchromatographie. *Tetrahedron*, 10(3–4), 158–163. DOI: 10.1016/S0040-4020(01)97800-4.\n* **United Nations Office on Drugs and Crime (UNODC).** (2020). *Recommended Methods for the Identification and Analysis of Synthetic Cannabinoid Receptor Agonists in Seized Materials* (Manual for Use by National Drug Analysis Laboratories, ST/NAR/48/Rev.1). United Nations Publications, Vienna.\n* **Sharma, S. K., Rao, S. C., & Sharma, V. K.** (2010). Detection of cannabinoids in urine using high-performance thin-layer chromatography. *Indian Journal of Medical Research*, 132(2), 202–208.\n* **Gontcharova, O. A., Sherma, J., & Voyksner, R. D.** (2009). High performance thin layer chromatography determination of $\\alpha$-tocopherol and $\\alpha$-tocopheryl acetate in dietary supplements. *Journal of Food Composition and Analysis*, 22(5), 421–427. DOI: 10.1016/j.jfca.2008.06.012.\n\n---\n\n## Resources & Further Reading\n\n* **National Harm Reduction Coalition:** Educational toolkits, policy advocacy, and community harm-reduction training guides. Visit `harmreduction.org`.\n* **DanceSafe:** Field drug checking methodologies, reagent testing kits, and community-level harm reduction resources. Visit `dancesafe.org`.\n* **NEXT Distro:** Mail-based naloxone distribution and harm-reduction supply access for individuals unable to access local brick-and-mortar programs. Visit `nextdistro.org`.\n* **Never Use Alone:** A peer-run, non-judgmental telephone safety line providing emergency call monitoring for people using substances alone. Call (800) 484-3731 or visit `neverusealone.com`.\n* **The Purple Canary Project & TehWiz:** Access the open-source software, digital densitometry scanner, and protocol updates. Visit `tehwiz.com`.\n\n---\n\n## Acknowledgments\n\nThis book exists because a community refused to accept that drug checking belonged only behind closed institutional doors.\n\nImmense gratitude to Sharon, whose patience, partnership, and kitchen spices made this entire architecture possible.\n\nThank you to Joe, whose Menards caliper and skepticism regarding pharmaceutical vaults kept this project grounded in real-world physics.\n\nAnd thank you to the peer specialists, outreach workers, shelter staff, and street medics who stand on the frontlines every day, meeting people where they are and doing the quiet, vital work of keeping human beings alive.\n\n---\n\n## About the Author\n\n**Michael Scott Hoyt** is a full-stack software developer, systems architect, and technology entrepreneur based in Traverse City and Northern Michigan. A practitioner in web architecture, computer vision, and systems engineering since 2009, he has built decentralized applications, high-performance security utilities, and community technology platforms.\n\nThrough the Purple Canary Project, he combines accessible, food-grade analytical chemistry with mobile computer vision to put point-of-care forensic verification directly into the hands of ordinary consumers and frontline harm-reduction agencies. He operates TehWiz Productions at `tehwiz.com`.",

      "markdown": "# Coming Next: The Sequel\n\n### *For Joe — who begged me not to write it.*\n\n---\n\n### An Introduction to the Sequel: *The Cannabinoid Cookbook*\n\nFor years, the standard street playbook has treated synthetic drugs, heavy sedatives, and adulterated street pharmaceuticals as unavoidable hazards. But having spent years inside large-scale commercial extraction facilities—first scaling processing operations in Texas, then running high-throughput production labs in Michigan—the reality became undeniable: **cannabinoids can replace almost damn near all of them**.\n\nThe next volume tackles the other half of the equation.\n\nIf *What Was In That Joint Bro!?* provides the defensive radar to detect adulterated garbage and stay alive, the upcoming cookbook lays out the proactive substitution framework: how natural phytocannabinoid formulations, minor cannabinoid ratios, and targeted plant preparations can systematically displace the toxic, unpredictable pharmaceuticals dominating the street.\n\nThe testing protocol in your hands is its lifelong companion. Verify what's real, clear out the poison, and build the clean alternative.",

    // Font Scaling System (Bigger / Smaller Controls)
    const FONT_SCALES = [
      { label: '80%', px: 13 },

    let currentFontScaleIndex = 2; // Default 100%

    function applyFontSize(index) {
      const container = document.getElementById('markdown-container');
      const oldFraction = totalPagesInChapter > 1 ? (currentPageIndex / (totalPagesInChapter - 1)) : 0;
      currentFontScaleIndex = Math.max(0, Math.min(FONT_SCALES.length - 1, index));
      const scale = FONT_SCALES[currentFontScaleIndex];
      
      document.documentElement.style.setProperty('--reader-font-size', `${scale.px}px`);
      if (container) {
        container.style.setProperty('--reader-font-size', `${scale.px}px`);
        void container.offsetHeight; // Force immediate layout reflow
      }

      const label = document.getElementById('font-size-label');
      if (label) label.innerText = scale.label;

      const decBtn = document.getElementById('font-dec-btn');
      const incBtn = document.getElementById('font-inc-btn');
      if (decBtn) decBtn.disabled = (currentFontScaleIndex === 0);
      if (incBtn) incBtn.disabled = (currentFontScaleIndex === FONT_SCALES.length - 1);

      try {
        localStorage.setItem('purple_canary_font_scale_idx', currentFontScaleIndex);
      } catch (e) {}

      // Recalculate pagination immediately
      updatePagination(true, oldFraction);

      // And follow up on the next frame to catch any subpixel font metric rasterization
      requestAnimationFrame(() => {
        updatePagination(true, oldFraction);
      });
    }

    // Set of chapter indices whose sections are currently expanded/spoiled
    const expandedChapters = new Set([0]);

    const expandedParts = new Set(['PART ONE: FOR EVERYONE', 'PART TWO: FOR HARM-REDUCTION AGENCIES']);

    function toggleChapterExpand(idx, e) {
      if (e) e.stopPropagation();
      if (expandedChapters.has(idx)) {
        expandedChapters.delete(idx);
      } else {
        expandedChapters.add(idx);
      }
      renderNav();
    }

    function togglePartExpand(partName, e) {

        expandedParts.delete(partName);

    // Sidebar navigation rendering with collapsible Parts and spoilable chapter sections
    function renderNav() {

    function navigateToGlossary(slug) {
      const glossaryIdx = BOOK_DATA.chapters.findIndex(c => c.filename.includes('Back Matter') || c.id.includes('back-matter'));
      if (glossaryIdx === -1) return;

      expandedChapters.add(glossaryIdx);
      if (currentChapterIndex === glossaryIdx) {
        jumpToHeading(slug);
        highlightGlossaryTerm(slug);
      } else {
        navigateTo(glossaryIdx, slug);
        setTimeout(() => highlightGlossaryTerm(slug), 240);
      }
    }

    function highlightGlossaryTerm(slug) {
      const el = document.getElementById(slug);
      if (!el) return;
      el.classList.remove('glossary-target-highlight');
      void el.offsetWidth;
      el.classList.add('glossary-target-highlight');
      setTimeout(() => {
        el.classList.remove('glossary-target-highlight');
      }, 3000);
    }

    function annotateGlossaryTerms(container) {
      const skipTags = new Set(['A', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'PRE', 'CODE', 'BUTTON', 'INPUT', 'SELECT', 'TEXTAREA', 'SCRIPT', 'STYLE', 'ABBR']);
      const blocks = container.querySelectorAll('p, li, blockquote, td, th');

      blocks.forEach(block => {
        const textNodes = [];
        const walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT, {
          acceptNode(node) {
            let parent = node.parentElement;
            while (parent && parent !== block) {
              if (skipTags.has(parent.tagName)) return NodeFilter.FILTER_REJECT;
              if (parent.classList && (parent.classList.contains('katex') || parent.classList.contains('math-inline'))) return NodeFilter.FILTER_REJECT;
              parent = parent.parentElement;
            }
            if (parent && skipTags.has(parent.tagName)) return NodeFilter.FILTER_REJECT;
            if (parent && parent.classList && (parent.classList.contains('katex') || parent.classList.contains('math-inline'))) return NodeFilter.FILTER_REJECT;
            return NodeFilter.FILTER_ACCEPT;
          }
        });

        let n;
        while (n = walker.nextNode()) {
          textNodes.push(n);
        }

        const annotatedInBlock = new Set();

        textNodes.forEach(textNode => {
          let text = textNode.nodeValue;
          if (!text || text.length < 2) return;

          for (const item of GLOSSARY_TERMS) {
            if (annotatedInBlock.has(item.slug)) continue;

            const regex = item.isRawRegex 
              ? new RegExp(`(${item.pattern})`, (item.caseSensitive ? '' : 'i') + 'u')
              : new RegExp(`\b(${item.pattern})\b`, (item.caseSensitive ? '' : 'i') + 'u');
            
            const match = regex.exec(text);
            if (match) {
              const matchIndex = match.index;
              const matchText = match[0];

              const beforeText = text.substring(0, matchIndex);
              const afterText = text.substring(matchIndex + matchText.length);

              const linkEl = document.createElement('a');
              linkEl.href = `#${item.slug}`;
              linkEl.className = 'glossary-term-link';
              linkEl.onclick = (e) => {
                e.preventDefault();
                e.stopPropagation();
                navigateToGlossary(item.slug);
              };

              const abbrEl = document.createElement('abbr');
              abbrEl.className = 'glossary-abbr';
              abbrEl.title = `${item.abbr}: ${item.def}`;
              abbrEl.textContent = matchText;
              linkEl.appendChild(abbrEl);

              const frag = document.createDocumentFragment();
              if (beforeText) frag.appendChild(document.createTextNode(beforeText));
              frag.appendChild(linkEl);

              const afterNode = afterText ? document.createTextNode(afterText) : null;
              if (afterNode) frag.appendChild(afterNode);

              textNode.parentNode.replaceChild(frag, textNode);
              annotatedInBlock.add(item.slug);

              if (afterNode) {
                textNode = afterNode;
                text = afterText;
              } else {
                break;
              }
            }
          }
        });
      });
    }

    // High-fidelity LaTeX math and symbol renderer (KaTeX with offline fallback)
    function renderMathEquations(container) {
      if (!container) return;

      if (window.renderMathInElement) {
        try {
          renderMathInElement(container, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false }
            ],
            throwOnError: false
          });
          return;
        } catch (err) {
          console.warn('KaTeX renderMathInElement failed, using fallback:', err);
        }
      }

      // Offline / standalone fallback for LaTeX math symbols & formulas
      const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
      const textNodes = [];
      let n;
      while (n = walker.nextNode()) {
        if (n.nodeValue && n.nodeValue.includes('$')) {
          textNodes.push(n);
        }
      }

      textNodes.forEach(node => {
        const val = node.nodeValue;
        if (!val || !val.includes('$')) return;

        let p = node.parentElement;
        while (p && p !== container) {
          if (p.tagName === 'CODE' || p.tagName === 'PRE') return;
          p = p.parentElement;
        }

        const replaced = val.replace(/\$([^\$\n]+)\$/g, (match, formula) => {
          let f = formula
            .split('\\alpha').join('α')
            .split('\\beta').join('β')
            .split('\\gamma').join('γ')
            .split('\\delta').join('δ')
            .split('\\Delta').join('Δ')
            .split('\\varepsilon').join('ε')
            .split('\\epsilon').join('ε')
            .split('\\mu').join('µ')
            .split('\\approx').join('≈')
            .split('\\le').join('≤')
            .split('\\ge').join('≥')
            .split('\\times').join('×')
            .split('\\pm').join('±')
            .replace(/\\text\{([^}]+)\}/g, '$1')
            .replace(/_\{?([a-zA-Z0-9]+)\}?/g, '<sub>$1</sub>')
            .replace(/\^\{?([a-zA-Z0-9]+)\}?/g, '<sup>$1</sup>');
          return `<span class="math-inline font-mono text-purple-200">${f}</span>`;
        });

        if (replaced !== val) {
          const span = document.createElement('span');
          span.innerHTML = replaced;
          node.parentNode.replaceChild(span, node);
        }
      });
    }

    function renderChapter(index, targetPage = 0) {
      currentChapterIndex = index;
      expandedChapters.add(index);
      const chapter = BOOK_DATA.chapters[index];
      if (chapter && chapter.part) {
        expandedParts.add(chapter.part);
      }
      
      document.title = `${chapter.title} — What Was In That Joint Bro!?`;
      document.getElementById('crumb-active').innerText = chapter.title;

      const words = chapter.wordCount || (chapter.markdown ? chapter.markdown.trim().split(/\s+/).length : 0);
      const totalMins = chapter.readingMinutes || Math.max(1, Math.round(words / 200));

      document.getElementById('reading-time-badge').innerText = `~${totalMins}m`;

      // Render Markdown via marked.js
      const container = document.getElementById('markdown-container');
      container.innerHTML = marked.parse(chapter.markdown);

      // Render LaTeX equations & Greek symbols ($R_f = 0.00$, $lpha$, $eta$, etc.)
      renderMathEquations(container);

      // Ensure headings have predictable IDs for in-chapter jump navigation
      container.querySelectorAll('h1, h2, h3, h4').forEach(h => {
        if (!h.id) {
          h.id = h.innerText.toLowerCase().replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-');
        }
      });

      // Annotate glossary terms with <abbr> tags and links to the glossary
      const glossaryIdx = BOOK_DATA.chapters.findIndex(c => c.filename.includes('Back Matter') || c.id.includes('back-matter'));
      if (index !== glossaryIdx) {
        annotateGlossaryTerms(container);
      }

      // Attach click interceptors for glossary anchors
      container.querySelectorAll('a[href^="#term-"]').forEach(a => {
        a.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const slug = a.getAttribute('href').slice(1);
          navigateToGlossary(slug);
        });
      });

      // Update Prev / Next Chapter footer buttons
      const prevChapBtn = document.getElementById('btn-prev-chap');
      const nextChapBtn = document.getElementById('btn-next-chap');
      const prevChapLabel = document.getElementById('prev-chap-label');
      const nextChapLabel = document.getElementById('next-chap-label');

      if (index > 0) {
        prevChapBtn.classList.remove('invisible');
        if (prevChapLabel) prevChapLabel.innerText = BOOK_DATA.chapters[index - 1].title;
      } else {
        prevChapBtn.classList.add('invisible');
      }

      if (index < BOOK_DATA.chapters.length - 1) {
        nextChapBtn.classList.remove('invisible');
        if (nextChapLabel) nextChapLabel.innerText = BOOK_DATA.chapters[index + 1].title;
      } else {
        nextChapBtn.classList.add('invisible');
      }

      renderNav();
      history.replaceState(null, '', `#${chapter.id}`);

      // Calculate pages and jump to target page
      requestAnimationFrame(() => {
        updatePagination(false);
        if (targetPage === 'last') {
          goToPage(totalPagesInChapter - 1, false);
        } else if (typeof targetPage === 'string') {
          jumpToHeading(targetPage);
        } else {
          goToPage(typeof targetPage === 'number' ? targetPage : 0, false);
        }
      });
    }

    // Recalculates horizontal columns and page count
    function updatePagination(maintainFraction = false, oldFraction = 0) {
      const container = document.getElementById('markdown-container');
      if (!container) return;

      const pageWidth = container.clientWidth;
      if (pageWidth <= 0) return;

      container.style.columnWidth = `${pageWidth}px`;
      container.style.columnGap = '0px';

      // Total pages derived from full horizontal scroll width of markdown-container
      totalPagesInChapter = Math.max(1, Math.round(container.scrollWidth / pageWidth));

      if (maintainFraction) {
        currentPageIndex = Math.min(totalPagesInChapter - 1, Math.round(oldFraction * (totalPagesInChapter - 1)));
      } else {
        currentPageIndex = Math.max(0, Math.min(totalPagesInChapter - 1, currentPageIndex));
      }

      goToPage(currentPageIndex, false);
    }

    // Flips to a specific page index
    function goToPage(pageIdx, smooth = true) {
      const container = document.getElementById('markdown-container');
      if (!container) return;

      const pageWidth = container.clientWidth;
      currentPageIndex = Math.max(0, Math.min(totalPagesInChapter - 1, pageIdx));

      container.scrollTo({
        left: currentPageIndex * pageWidth,
        behavior: smooth ? 'smooth' : 'instant'
      });

      updatePageIndicators();
    }

    // Step pages left (-1) or right (+1)
    function flipPage(delta) {
      const target = currentPageIndex + delta;
      if (target >= 0 && target < totalPagesInChapter) {
        goToPage(target, true);
      } else if (target >= totalPagesInChapter) {
        // Flipping past last page advances to next chapter
        if (currentChapterIndex < BOOK_DATA.chapters.length - 1) {
          navigateTo(currentChapterIndex + 1, 0);
        }
      } else if (target < 0) {
        // Flipping before first page steps to prev chapter's last page
        if (currentChapterIndex > 0) {
          navigateTo(currentChapterIndex - 1, 'last');
        }
      }
    }

    // Update all page count, progress bar, and reading minute badges
    function updatePageIndicators() {
      const chapter = BOOK_DATA.chapters[currentChapterIndex];
      const words = chapter.wordCount || (chapter.markdown ? chapter.markdown.trim().split(/\s+/).length : 0);
      const totalMins = chapter.readingMinutes || Math.max(1, Math.round(words / 200));

      const pageNum = currentPageIndex + 1;
      const totalPages = totalPagesInChapter;

      // Percentage of current chapter read
      const percent = totalPages > 1 
        ? Math.min(100, Math.round((pageNum / totalPages) * 100))
        : 100;

      // Remaining minutes on this chapter
      const fractionRemaining = Math.max(0, (totalPages - pageNum) / totalPages);
      const minsLeft = Math.max(0, Math.round(totalMins * fractionRemaining));

      // Global top line progress bar
      const topBar = document.getElementById('progress-bar');
      if (topBar) topBar.style.width = `${percent}%`;

      // Reader header progress fill & percent
      const pageFill = document.getElementById('page-progress-fill');
      if (pageFill) pageFill.style.width = `${percent}%`;

      const progressPercentText = document.getElementById('progress-percent-text');
      if (progressPercentText) progressPercentText.innerText = `${percent}%`;

      const timeRemainingText = document.getElementById('time-remaining-text');
      if (timeRemainingText) {
        if (pageNum === totalPages) {
          timeRemainingText.innerHTML = `<span class="text-emerald-400 font-semibold">✓ End of chapter</span>`;
        } else {
          timeRemainingText.innerText = `~${minsLeft}m left (${pageNum}/${totalPages})`;
        }
      }

      // Live header stat
      const headerStat = document.getElementById('header-stat-text');
      if (headerStat) {
        if (pageNum === totalPages) {
          headerStat.innerHTML = `<span class="text-emerald-400">✓ Page ${pageNum}/${totalPages}</span>`;
        } else {
          headerStat.innerText = `⏱️ ~${minsLeft}m left (Page ${pageNum}/${totalPages})`;
        }
      }

      // Footer page counter
      const pageCounterLabel = document.getElementById('page-counter-label');
      if (pageCounterLabel) {
        pageCounterLabel.innerText = `Page ${pageNum} of ${totalPages}`;
      }

      // Floating flip arrows disabled status
      const btnPrev = document.getElementById('btn-flip-prev');
      const btnNext = document.getElementById('btn-flip-next');
      if (btnPrev) {
        btnPrev.disabled = (currentPageIndex === 0 && currentChapterIndex === 0);
        btnPrev.title = (currentPageIndex === 0) ? "Previous Chapter" : "Previous Page (←)";
      }
      if (btnNext) {
        btnNext.disabled = (currentPageIndex === totalPages - 1 && currentChapterIndex === BOOK_DATA.chapters.length - 1);
        btnNext.title = (currentPageIndex === totalPages - 1) ? "Next Chapter (→)" : "Next Page (→)";
      }
    }

    function jumpToHeading(slug) {
      const el = document.getElementById(slug);
      const container = document.getElementById('markdown-container');
      if (!el || !container) return;

      const containerRect = container.getBoundingClientRect();
      const elRect = el.getBoundingClientRect();
      const trueLeft = elRect.left - containerRect.left + container.scrollLeft;
      const targetPage = Math.max(0, Math.min(totalPagesInChapter - 1, Math.floor(trueLeft / container.clientWidth)));
      
      goToPage(targetPage, true);
    }

    function navigateTo(index, targetPage = 0) {
      if (index >= 0 && index < BOOK_DATA.chapters.length) {
        renderChapter(index, targetPage);
      }
    }

    function stepChapter(delta) {
      navigateTo(currentChapterIndex + delta, 0);
    }

    // Instant search with exact page jumping
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');

    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (!q) {
        searchResults.classList.add('hidden');
        return;
      }

      const matches = [];
      BOOK_DATA.chapters.forEach((chap, chapIdx) => {
        const text = chap.markdown.toLowerCase();
        const foundPos = text.indexOf(q);
        if (foundPos !== -1 || chap.title.toLowerCase().includes(q)) {
          const start = Math.max(0, foundPos - 40);
          const snippet = chap.markdown.substr(start, 90).replace(/[#*`]/g, '');
          matches.push({ chapIdx, title: chap.title, snippet, query: q });
        }
      });

      if (matches.length > 0) {
        searchResults.innerHTML = matches.slice(0, 8).map(m => `
          <div onclick="selectSearchResult(${m.chapIdx}, '${m.query.replace(/'/g, "\'")}')" 
               class="p-2 rounded hover:bg-slate-800 cursor-pointer text-xs">
            <div class="font-semibold text-purplecore-300">${m.title}</div>
            <div class="text-slate-400 truncate mt-0.5">...${m.snippet}...</div>
          </div>
        `).join('');
        searchResults.classList.remove('hidden');
      } else {
        searchResults.innerHTML = '<div class="p-2 text-xs text-slate-500">No matching text found.</div>';
        searchResults.classList.remove('hidden');
      }
    });

    function selectSearchResult(chapIdx, query) {
      searchResults.classList.add('hidden');
      searchInput.value = '';
      navigateTo(chapIdx, 0);

      // Seek text node match and flip to that page
      setTimeout(() => {
        const container = document.getElementById('markdown-container');
        if (!container) return;

        const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
        let node;
        while (node = walker.nextNode()) {
          if (node.nodeValue.toLowerCase().includes(query.toLowerCase())) {
            const parent = node.parentElement;
            if (parent) {
              const containerRect = container.getBoundingClientRect();
              const pRect = parent.getBoundingClientRect();
              const trueLeft = pRect.left - containerRect.left + container.scrollLeft;
              const targetPage = Math.max(0, Math.min(totalPagesInChapter - 1, Math.floor(trueLeft / container.clientWidth)));
              goToPage(targetPage, true);
              break;
            }
          }
        }
      }, 150);
    }

    // Sidebar toggling (Desktop & Mobile)
    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebar-toggle');
    const sidebarClose = document.getElementById('sidebar-close');

    function toggleSidebar() {
      if (window.innerWidth < 768) {
        sidebar.classList.toggle('-translate-x-full');
      } else {
        sidebar.classList.toggle('hidden');
        requestAnimationFrame(() => updatePagination(true));
      }
    }
    function closeSidebar() {
      sidebar.classList.add('-translate-x-full');
    }

    sidebarToggle.addEventListener('click', toggleSidebar);
    if (sidebarClose) sidebarClose.addEventListener('click', closeSidebar);

    // Window resize observer to re-paginate smoothly
    window.addEventListener('resize', () => {
      updatePagination(true);
    });

    // Support manual scrollbar dragging: synchronize page counter and progress in real time
    let manualScrollTimeout = null;
    const markdownContainerEl = document.getElementById('markdown-container');
    if (markdownContainerEl) {
      markdownContainerEl.addEventListener('scroll', () => {
        if (manualScrollTimeout) clearTimeout(manualScrollTimeout);
        manualScrollTimeout = setTimeout(() => {
          const pageWidth = markdownContainerEl.clientWidth;
          if (pageWidth > 0 && totalPagesInChapter > 0) {
            const newPage = Math.max(0, Math.min(totalPagesInChapter - 1, Math.round(markdownContainerEl.scrollLeft / pageWidth)));
            if (newPage !== currentPageIndex) {
              currentPageIndex = newPage;
              updatePageIndicators();
            }
          }
        }, 50);
      }, { passive: true });
    }

    // Touch / Swipe Gesture Page Turning
    let touchStartX = 0;
    let touchStartY = 0;
    
    markdownContainerEl.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    markdownContainerEl.addEventListener('touchend', (e) => {
      const diffX = e.changedTouches[0].clientX - touchStartX;
      const diffY = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(diffX) > 40 && Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX < 0) flipPage(1);  // Swipe Left -> Next Page
        else flipPage(-1);           // Swipe Right -> Prev Page
      }
    }, { passive: true });

    // Trackpad / Mousewheel page flip with debounce
    let wheelDebounce = null;
    markdownContainerEl.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (wheelDebounce) return;
      const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (Math.abs(delta) > 30) {
        if (delta > 0) flipPage(1);
        else flipPage(-1);
        wheelDebounce = setTimeout(() => { wheelDebounce = null; }, 320);
      }
    }, { passive: false });

    // Font size control listeners
    document.getElementById('font-dec-btn').addEventListener('click', () => applyFontSize(currentFontScaleIndex - 1));
    document.getElementById('font-inc-btn').addEventListener('click', () => applyFontSize(currentFontScaleIndex + 1));
    document.getElementById('font-reset-btn').addEventListener('click', () => applyFontSize(2));

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      // Focus Search: Cmd/Ctrl + K
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        searchInput.focus();
        return;
      }

      // Font scaling: Alt + '+' / '-' / '0'
      if (e.altKey && (e.key === '=' || e.key === '+')) {
        e.preventDefault();
        applyFontSize(currentFontScaleIndex + 1);
        return;
      }
      if (e.altKey && (e.key === '-' || e.key === '_')) {
        e.preventDefault();
        applyFontSize(currentFontScaleIndex - 1);
        return;
      }
      if (e.altKey && e.key === '0') {
        e.preventDefault();
        applyFontSize(2);
        return;
      }

      // Toggle Table of Contents: T
      if (e.key.toLowerCase() === 't' && document.activeElement !== searchInput) {
        toggleSidebar();
        return;
      }

      // Page Navigation Keyboard Controls
      if (document.activeElement !== searchInput) {
        // Next Page: Right Arrow, PageDown, Space, 'l'
        if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ' || e.key.toLowerCase() === 'l') {
          e.preventDefault();
          flipPage(1);
        }
        // Prev Page: Left Arrow, PageUp, Shift+Space, 'h'
        if (e.key === 'ArrowLeft' || e.key === 'PageUp' || (e.key === ' ' && e.shiftKey) || e.key.toLowerCase() === 'h') {
          e.preventDefault();
          flipPage(-1);
        }
        // Prev / Next Chapter: '[' and ']'
        if (e.key === '[') stepChapter(-1);
        if (e.key === ']') stepChapter(1);
      }
    });

    // Hash router boot & initialize state
    window.addEventListener('DOMContentLoaded', () => {
      try {
        const savedFontIdx = localStorage.getItem('purple_canary_font_scale_idx');
        if (savedFontIdx !== null) {
          applyFontSize(parseInt(savedFontIdx, 10));
        } else {
          applyFontSize(2);
        }
      } catch (e) {
        applyFontSize(2);
      }

      const hash = window.location.hash.replace('#', '');
      const initialIdx = BOOK_DATA.chapters.findIndex(c => c.id === hash);
      renderChapter(initialIdx !== -1 ? initialIdx : 0, 0);
    });
  </script>
</body>
</html>
