name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: Optional Pandoc installation
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc || echo "Pandoc installation skipped"

      - name: Compile Book & Generate Wiki SPA
        run: |
          python3 compile_book.py
          python3 generate_wiki_spa.py

      - name: Verify build artifacts
        run: |
          echo "Checking dist directory content:"
          ls -la dist/
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test -f dist/llms.txt || { echo "dist/llms.txt missing"; exit 1; }
          test -f dist/robots.txt || { echo "dist/robots.txt missing"; exit 1; }
          test -f dist/CNAME || { echo "dist/CNAME missing"; exit 1; }
          test -f dist/cover.png || { echo "dist/cover.png missing"; exit 1; }

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
